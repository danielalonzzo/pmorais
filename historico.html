    :root {
        /* Colors */
        --color-bg: #0B0B0B;
        --color-surface: #111111;
        --color-primary: #E6AE17;
        /* Updated to match target */
        --color-primary-hover: #d5a015;
        --color-light-gray: #F2F2F2;
        /* New split section color */
        --color-text: #ffffff;
        --color-text-dim: #cccccc;
        --color-accent: #ffffff;
        --color-brand-primary: #ffffff;
        --color-brand-secondary: var(--color-primary);
        --color-brand-tertiary: #0A6FE8;
    
        /* Typography */
        --font-heading: 'Patron', sans-serif;
        --font-body: 'Patron', sans-serif;
        /* Clean, modern sans-serif */
    
        /* Spacing */
        --container-width: 1200px;
        --section-padding: clamp(60px, 10vw, 100px) 20px;
        /* Fluid section padding */
    
        /* Transitions */
        --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        line-height: 1.6;
        overflow-x: hidden;
        /* Scrollbar natural del sistema, sin personalización */
    }
    #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #F4B618;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loader-content {
        position: relative;
        width: 250px;
        /* Ajustado para el logo */
        height: auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .loader-logo {
        width: 100%;
        height: auto;
        display: block;
        position: relative;
        z-index: 1;
    }
    .shimmer-effect {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    
        /* Mask the shimmer to the logo shape */
        -webkit-mask-image: url('images/logo/logo_bw_loading.png');
        mask-image: url('images/logo/logo_bw_loading.png');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
    
        /* The Moving Light Gradient */
        background: linear-gradient(135deg,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0.7) 50%,
                rgba(255, 255, 255, 0) 70%);
        background-size: 200% 100%;
        background-position: 150% 0;
        animation: lightSweep 2s infinite ease-in-out;
    }
    </style>
