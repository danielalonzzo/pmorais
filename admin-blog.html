    :root {
        /* Colors */
        --color-bg: #0B0B0B;
        --color-surface: #111111;
        --color-primary: #E6AE17;
        /* Updated to match target */
        --color-primary-hover: #d5a015;

        --color-brand-tertiary: #0A6FE8;

        --font-heading: 'Patron', sans-serif;
        --font-body: 'Patron', sans-serif;
        /* Clean, modern sans-serif */

        --container-width: 1200px;

    body {

    #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #F4B618;
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .loader-content {
        position: relative;
        width: 250px;

        height: auto;
        display: flex;

    .shimmer-effect {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    
        /* Mask the shimmer to the logo shape */
        -webkit-mask-image: url('../images/logo/logo_bw_loading.png');
        mask-image: url('../images/logo/logo_bw_loading.png');
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
    
        /* The Moving Light Gradient */
        background: linear-gradient(135deg,
                rgba(255, 255, 255, 0) 30%,
                rgba(255, 255, 255, 0.7) 50%,
                rgba(255, 255, 255, 0) 70%);
        background-size: 200% 100%;
        background-position: 150% 0;
        animation: lightSweep 2s infinite ease-in-out;
    }

    <style nonce="pmorais-2026">
        .blog-admin-container {
            max-width: var(--container-width);
            margin: 0 auto 80px;
            padding: 0 20px;
            color: var(--color-text);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
            border-bottom: 1px solid color-mix(in srgb, var(--color-text), transparent 92%);
            padding-bottom: 20px;
        }

        .btn-primary {
            background: var(--color-primary);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 174, 23, 0.4);
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .post-card {
            background: color-mix(in srgb, var(--color-text), transparent 95%);
            border: 1px solid color-mix(in srgb, var(--color-text), transparent 92%);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }
        .post-card:hover {
            transform: translateY(-5px);
            border-color: rgba(230, 174, 23, 0.5);
        }

        .post-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            background: #222;
        }

        .post-card h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .post-card p.status {
            font-size: 0.85rem;
            margin-bottom: 15px;
        }
        .status.published { color: #4ade80; }
        .status.draft { color: #fbbf24; }

        .post-actions {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }
        .btn-edit, .btn-delete {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn-edit { background: rgba(255,255,255,0.1); color: var(--color-text); }
        .btn-edit:hover { background: rgba(255,255,255,0.2); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.2); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center;
            z-index: 2000; opacity: 0; visibility: hidden; transition: all 0.3s;
            backdrop-filter: blur(10px);
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--color-bg); width: 95%; max-width: 900px;
            padding: 40px; border-radius: 20px; border: 1px solid rgba(230, 174, 23, 0.3);
            max-height: 90vh; overflow-y: auto; position: relative;
        }
        .close-modal {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); border: none; color: var(--color-text); cursor: pointer;
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        .close-modal:hover { background: rgba(255,255,255,0.2); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 8px; background: rgba(0,0,0,0.2);
            border: 1px solid color-mix(in srgb, var(--color-text), transparent 80%); color: var(--color-text);
            font-family: inherit;
        }
        
        /* Quill overrides for dark mode */
        .ql-container {
            min-height: 250px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .ql-toolbar {
            background: #f1f1f1;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }
        .ql-editor { color: var(--color-text); }
        
        .lang-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .lang-tab {
            padding: 8px 24px;
            background: transparent;
            color: var(--color-text-dim);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .lang-tab.active {
            background: rgba(230, 174, 23, 0.15);
            color: var(--color-primary);
        }
        .lang-content { display: none; }
        .lang-content.active { display: block; }
        
        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .toggle-switch input { display: none; }
        .slider {
            width: 46px; height: 24px; background: rgba(255,255,255,0.2);
            border-radius: 24px; position: relative; transition: 0.3s;
        }
        .slider::before {
            content: ""; position: absolute; width: 18px; height: 18px;
            border-radius: 50%; top: 3px; left: 3px; background: #fff; transition: 0.3s;
        }
        .toggle-switch input:checked + .slider { background: #4ade80; }
        .toggle-switch input:checked + .slider::before { transform: translateX(22px); }

    </style>

    <!-- Modal for Post Editor -->
    <div id="modal-post" class="modal-overlay">
        <div class="modal-content">
            <button id="btn-close-modal" class="close-modal"><i data-lucide="x" aria-hidden="true"></i></button>

            <form id="post-form">

                <div class="form-group">
                    <label for="post-slug">Slug (URL amigável - ex: beneficios-osteopatia)</label>
                    <input type="text" id="post-slug" required pattern="[a-z0-9-]+" title="Apenas letras minúsculas, números e hífen">
                </div>
                
                <div class="form-group">
                    <label for="post-cover">URL da Imagem de Capa</label>
                    <input type="url" id="post-cover" placeholder="https://..." required>
                </div>

                <!-- Language Tabs -->
                <div class="lang-tabs">
                    <button type="button" class="lang-tab active" data-lang="pt">Português (PT)</button>

                </div>

                <!-- PT Content -->
                <div class="lang-content active" id="content-pt">
                    <div class="form-group">
                        <label>Título (PT)</label>
                        <input type="text" id="title-pt" required>
                    </div>
                    <div class="form-group">
                        <label>Resumo Breve (PT) - Usado nos cartões</label>
                        <textarea id="summary-pt" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Conteúdo (PT)</label>
                        <!-- Quill editor container -->
                        <div id="editor-pt"></div>
                    </div>
                </div>

                <!-- EN Content -->
                <div class="lang-content" id="content-en">
                    <div class="form-group">
                        <label>Title (EN)</label>
                        <input type="text" id="title-en" required>
                    </div>
                    <div class="form-group">
                        <label>Brief Summary (EN) - Used in cards</label>
                        <textarea id="summary-en" rows="3" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Content (EN)</label>
                        <!-- Quill editor container -->
                        <div id="editor-en"></div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 30px; display: flex; justify-content: space-between; align-items: center;">
                    <label class="toggle-switch">
                        <input type="checkbox" id="post-published">
                        <div class="slider"></div>
                        <span>Publicado (Visível no site)</span>
                    </label>
                    
                    <button type="submit" class="btn-primary" id="btn-save-post">
                        <i data-lucide="save" aria-hidden="true"></i> Guardar Artigo
                    </button>
                </div>
            </form>
        </div>

    <script nonce="pmorais-2026">
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
            
            // Tab switcher
            const tabs = document.querySelectorAll('.lang-tab');
            const contents = document.querySelectorAll('.lang-content');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(`content-${tab.dataset.lang}`).classList.add('active');
                });
            });
        });
    </script>
