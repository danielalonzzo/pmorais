                                <div id="video-preview-container" style="display: none; position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; margin-top: 15px; border: 1px solid color-mix(in srgb, var(--color-text), transparent 90%); background: #000;">
                                    <iframe id="video-preview-iframe" src="" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
                                </div>
                            </div>

                            <div id="dynamic-fields-pdf" class="format-fields dynamic-fields-wrapper" style="display: none;">
                                <div class="form-group">
                                    <label for="post-pdf-url">Link do Documento (PDF, Estudo)</label>
                                    <input type="url" id="post-pdf-url" placeholder="URL do ficheiro (Google Drive, etc...)">
                                </div>
                            </div>

                            <div id="dynamic-fields-case" class="format-fields dynamic-fields-wrapper" style="display: none;">
                                <div class="form-group" style="margin-bottom: 15px;">
                                    <label for="post-before-img">Link da Imagem "Antes"</label>
                                    <input type="url" id="post-before-img" placeholder="https://...">
                                </div>
                                <div class="form-group">
                                    <label for="post-after-img">Link da Imagem "Depois"</label>
                                    <input type="url" id="post-after-img" placeholder="https://...">
                                </div>
                            </div>
                        </div>

                <!-- FOOTER -->
                <div class="admin-footer-block">
                    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                        <label class="toggle-switch">
                            <input type="checkbox" id="post-published">
                            <div class="slider"></div>
                            <span style="white-space: nowrap;">Publicado (Visível)</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="btn-save-post" style="padding: 12px 30px; font-size: 1.1rem;">
                        <i data-lucide="upload-cloud" aria-hidden="true"></i> Publicar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script nonce="pmorais-2026" src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <script nonce="pmorais-2026" src="js/script.js?v=1.5.1" defer></script>
    <script nonce="pmorais-2026">
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) window.lucide.createIcons();
            
            // Tab switcher
            const tabs = document.querySelectorAll('.lang-tab');
            const contents = document.querySelectorAll('.lang-content');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    contents.forEach(c => c.classList.remove('active'));
                    
                    tab.classList.add('active');
                    document.getElementById(`content-${tab.dataset.lang}`).classList.add('active');
                });
            });
        });
    </script>
