name: SEO consistency

on:
  push:
    paths:
      - '**/*.html'
      - 'js/**'
      - 'en/js/**'
      - 'scripts/**'
      - 'firebase.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seo-consistency.yml'
  pull_request:
    paths:
      - '**/*.html'
      - 'js/**'
      - 'en/js/**'
      - 'scripts/**'
      - 'firebase.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms*.txt'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/seo-consistency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate generated discovery and page signals
        run: npm test

      - name: Verify generated files are committed
        run: |
          npm run seo:apply
          if ! git diff --quiet; then
            echo "SEO-generated files are not committed. Changed files:"
            git --no-pager diff --name-only
            echo
            echo "Full diff:"
            git --no-pager diff
            exit 1
          fi
