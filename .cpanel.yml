---
deployment:
  tasks:
    - export DEPLOYPATH=/home/pmoraisp/public_html
    - /bin/cp .htaccess "$DEPLOYPATH/.htaccess"
    - /bin/rm -rf "$DEPLOYPATH/functions" "$DEPLOYPATH/scripts" "$DEPLOYPATH/tests" "$DEPLOYPATH/scratch" "$DEPLOYPATH/node_modules" "$DEPLOYPATH/tmp" "$DEPLOYPATH/assets"
    - /bin/rm -f "$DEPLOYPATH/firebase.json" "$DEPLOYPATH/firebase-debug 2.log" "$DEPLOYPATH/firestore.indexes.json" "$DEPLOYPATH/firestore.rules" "$DEPLOYPATH/package.json" "$DEPLOYPATH/package-lock.json" "$DEPLOYPATH/playwright.config.js" "$DEPLOYPATH/README.md" "$DEPLOYPATH/.env" "$DEPLOYPATH/service-account.json" "$DEPLOYPATH/logs.txt" "$DEPLOYPATH/FILE_NAME" "$DEPLOYPATH/convert_webp.js"
    - /bin/rm -f "$DEPLOYPATH/add_nonces.py" "$DEPLOYPATH/add_view_transition.py" "$DEPLOYPATH/fix_images.py" "$DEPLOYPATH/inject_critical_css.py" "$DEPLOYPATH/test_regex.py" "$DEPLOYPATH/update_firebase_sdk.py" "$DEPLOYPATH/update_html.py" "$DEPLOYPATH/.DS_Store"
    - /bin/mkdir -p "$DEPLOYPATH/assets/fonts"
    - /bin/cp assets/fonts/Patron-Light.woff2 assets/fonts/Patron-Regular.woff2 assets/fonts/Patron-Bold.woff2 "$DEPLOYPATH/assets/fonts/"
    # Personal training was merged into sobre-mim; .htaccess answers the old URLs with a 301.
    - /bin/rm -f "$DEPLOYPATH/treino-personalizado.html" "$DEPLOYPATH/en/personal-training.html"
    - /bin/cp -R css en images js "$DEPLOYPATH/"
    - /usr/bin/find "$DEPLOYPATH/css" "$DEPLOYPATH/en" "$DEPLOYPATH/images" "$DEPLOYPATH/js" -type f -name .DS_Store -delete
    # Source material nothing on the site links to: 62 MB of .mov logo animations,
    # 6 MB of .eps artwork and 35 MB of .heic screenshots whose .webp versions are
    # what the pages actually use. Deleting them here also clears the copies already
    # sitting on the server from previous deploys.
    - /usr/bin/find "$DEPLOYPATH/images" -type f -iname '*.mov' -delete
    - /usr/bin/find "$DEPLOYPATH/images" -type f -iname '*.eps' -delete
    - /usr/bin/find "$DEPLOYPATH/images" -type f -iname '*.heic' -delete
    - /bin/cp 404.html admin-blog.html artigo.html auth-action.html blog.html desinscrever.html formulario.html google0ef2004b37f69f6d.html historico.html index.html osteopatia.html perfil.html perfis.html politica-privacidade.html treino-em-grupo.html treino-online.html treino-oncologico.html sobre-mim.html termos-e-condicoes.html "$DEPLOYPATH/"
    - /bin/cp manifest.json robots.txt sitemap.xml sitemap-articles.xml llms.txt llms-full.txt sw.js firebase-messaging-sw.js 29c5fae97ae9363315db62e3db72671c.txt "$DEPLOYPATH/"
    # Refresh public article snapshots, including removal of deleted translations.
    - /bin/rm -rf "$DEPLOYPATH/artigos" "$DEPLOYPATH/en/articles"
    - /bin/cp -R artigos "$DEPLOYPATH/"
    - /bin/cp -R en/articles "$DEPLOYPATH/en/"
    # my.pmorais.pt (the retired 2020 WordPress) answers every URL with a 301 to its
    # page on pmorais.pt. Only a folder that still holds that WordPress is touched.
    - /bin/sh -c 'for d in /home/pmoraisp/my.pmorais.pt /home/pmoraisp/public_html/my.pmorais.pt /home/pmoraisp/public_html/my; do if [ -f "$d/wp-config.php" ]; then /bin/cp legacy/my.pmorais.pt/.htaccess "$d/.htaccess"; fi; done'
    # The Spanish site lives in /es/ once it is published (scripts/seo-config.mjs).
    - /bin/sh -c 'if [ -d es ]; then /bin/cp -R es "$DEPLOYPATH/"; fi'
    - /bin/cp openapi.json auth.md mcp.php "$DEPLOYPATH/"
    # Agent discovery surface: .well-known documents, the static read-only JSON
    # API and the markdown renditions. Removed first so a deleted page cannot
    # leave a stale rendition behind on the server.
    - /bin/rm -rf "$DEPLOYPATH/.well-known" "$DEPLOYPATH/api" "$DEPLOYPATH/agents"
    - /bin/cp -R .well-known api agents "$DEPLOYPATH/"
    - /usr/bin/find "$DEPLOYPATH/.well-known" "$DEPLOYPATH/api" "$DEPLOYPATH/agents" -type f -name .DS_Store -delete
